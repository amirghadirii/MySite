{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signup</title>


    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <h2 class="title">Create Account</h2>
        <p class="subtitle">Sign up for a new account</p>
        <form method="post" action="/accounts/signup/">
          {% csrf_token %}

          <div class="input-group-custom">
            <input type="text" name="username" required />
            <label>Username</label>
          </div>
          <div class="input-group-custom">
            <input type="email" name="email" required />
            <label>Email</label>
          </div>

          <div class="input-group-custom password-group">
            <input type="password" name="password1" id="password1" required />
            <label>Password</label>
            <span class="toggle-password" onclick="togglePassword('password1')">👁</span>
          </div>
          <div class="input-group-custom password-group">
            <input type="password" name="password2" id="password2" required />
            <label>Confirm Password</label>
            <span class="toggle-password" onclick="togglePassword('password2')">👁</span>
          </div>
          <button type="submit" class="login-btn">Signup</button>
          {% if form.errors %}
            <div class="alert alert-danger">
              <ul>
                {% for field in form %}
                  {% for error in field.errors %}
                    <li>{{ field.label }}: {{ error }}</li>
                  {% endfor %}
                {% endfor %}
              </ul>
            </div>
          {% endif %}
        </form>
      </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
  </body>
</html>

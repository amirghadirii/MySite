{% load static %}

<html lang="en">

    <title>Password Reset Done</title>


    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <h2 class="title">Password Reset</h2>
        <p class="subtitle">We have sent you an email. If you have not received it please check your spam folder. Otherwise contact us if you do not receive it in a few minutes.</p>
    
        <div class="options">
            <a href="{% url 'account_login' %}" class="login-btn" style="margin-right:20px ;">SIGN IN</a>
            <a href="{% url 'account_signup' %}" class="login-btn">SIGN UP</a>
        </div>
    </div>
</div>


<script src="{% static 'js/login.js' %}"></script>
</body>
</html>

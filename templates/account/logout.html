{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIGN IN</title>


    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <h2 class="title">Sign Out</h2>
        <p class="subtitle">Are you sure you want to sign out?</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="login-btn">Sign Out</button>
        </form>
        <div class="options" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
            <a href="{% url 'account_email' %}" class="login-btn">Update Email</a>
            <a href="{% url 'account_change_password' %}" class="login-btn">Change Password</a>
        </div>
    </div>
</div>


<script src="{% static 'js/login.js' %}"></script>
</body>
</html>
